<!doctype html>
<html lang="en">

<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Color Picker Pro</title>
	<meta name="description" content="A perceptually uniform color picker built with Svelte and culori." />
	<link rel="icon" href="./app/vite.svg" />
	<style>
		html,
		body {
			height: 100%;
			margin: 0;
			padding: 0;
		}

		/* Dotted grid backdrop, centering the framed picker. Matches the
		   original showcase framing. */
		body {
			display: flex;
			justify-content: center;
			align-items: center;
			overflow: hidden;
			background:
				radial-gradient(circle, #d7d7d7 10%, transparent 11%),
				radial-gradient(circle at bottom left, #d7d7d7 5%, transparent 6%),
				radial-gradient(circle at bottom right, #d7d7d7 5%, transparent 6%),
				radial-gradient(circle at top left, #d7d7d7 5%, transparent 6%),
				radial-gradient(circle at top right, #d7d7d7 5%, transparent 6%);
			background-size: 3em 3em;
			background-color: #fff;
		}

		/* The picker is its own Vite build under app/; the orange border frames
		   it. Width is the picker's 330px column plus the app shell's 2rem
		   padding on each side (330 + 2*32 = 394). Framing it at 330 alone left
		   that padding overflowing the iframe, so the picker was pushed right and
		   its right edge clipped. Height runs a little past the 330x600 box, so
		   it's fitted to the true footprint by the script below (the value here
		   is just the pre-load estimate). */
		iframe {
			width: 394px;
			height: 745px;
			border: 2px solid orange;
			background: #fff;
			display: block;
		}
	</style>
</head>

<body>
	<iframe id="picker" src="./app/index.html" title="Color Picker Pro" scrolling="no"></iframe>
	<script>
		// The picker app vertically centers itself and overflows its own 600px
		// box, so a fixed height would leave a centering gap and clip the nav.
		// Same-origin (same site), so reach in: top-align the app's body, then
		// size the frame to the picker's real height. Re-fit on content changes
		// (e.g. switching to a taller view) so nothing ever clips.
		(function () {
			var f = document.getElementById('picker');
			f.addEventListener('load', function () {
				var d = f.contentDocument;
				if (!d || !d.body) return;
				d.body.style.alignItems = 'flex-start';
				d.body.style.minHeight = '0';
				var fit = function () {
					f.style.height = d.documentElement.scrollHeight + 'px';
				};
				fit();
				if (window.ResizeObserver) {
					try {
						new ResizeObserver(fit).observe(d.documentElement);
					} catch (e) {}
				}
			});
		})();
	</script>
</body>

</html>
